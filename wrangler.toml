name = "ride-sasa"
main = "./worker.js"
compatibility_date = "2025-03-01"
workers_dev = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*", "/worker.js", "/wrangler.toml", "/migrations/*"]

[[d1_databases]]
binding = "DB"
database_name = "ride-sasa"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"

